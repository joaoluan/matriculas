services:
  # ---------- BACK-END (Express + fs/dados.json) ----------
  - type: web
    name: matriculas-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js

  # ---------- FRONT-END (React build estatico) ----------
  - type: web
    name: matriculas-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: matriculas-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
